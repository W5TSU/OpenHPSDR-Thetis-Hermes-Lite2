<title id="04-hl2-hardware-title">Hermes-Lite 2 specific hardware control</title>
<desc id="04-hl2-hardware-desc">Architecture diagram showing IoBoardHl2.cs receiving Protocol-1 control words from NetworkIO, applying HL2 model quirks, and driving the HL2 I/O board's antenna tuner and TX registers over its i2c-style interface.</desc>
