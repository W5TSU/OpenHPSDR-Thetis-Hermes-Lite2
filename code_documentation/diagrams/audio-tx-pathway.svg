<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1750 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audio-tx-pathway-title audio-tx-pathway-desc">
<title id="audio-tx-pathway-title">TX audio pathway</title>
<desc id="audio-tx-pathway-desc">Signal-flow diagram tracing transmit audio from the mic/VAC/TCI input through optional FreeDV/RADE encode, VOX gating, the wdsp TXA DSP chain, sidetone injection, and ChannelMaster's TX gain/EER staging out through the network to the HL2 board.</desc>
