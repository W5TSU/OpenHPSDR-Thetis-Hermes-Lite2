name: thetisctl

on:
  push:
    branches: [ master ]
    paths:
      - 'Tools/thetis-ai-control/**'
      - '.github/workflows/thetisctl.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Tools/thetis-ai-control/**'
      - '.github/workflows/thetisctl.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: Tools/thetis-ai-control

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: Tools/thetis-ai-control/go.mod

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o thetisctl ./cmd/thetisctl
