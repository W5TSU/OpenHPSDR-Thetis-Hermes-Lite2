# One-off tooling: builds drowe67/codec2 for Windows x64 and uploads the
# dll/import-lib/headers as an artifact, which is then vendored into
# Project Files/lib/codec2_x64/ for the FreeDV RX prototype (see FreeDV branch).
# Dispatch-only; not part of the normal build.
name: Build codec2 (Windows x64)

on:
  workflow_dispatch:
    inputs:
      codec2_ref:
        description: codec2 git ref (tag/branch/sha)
        default: "1.2.0"
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout codec2
        uses: actions/checkout@v4
        with:
          repository: drowe67/codec2
          ref: ${{ inputs.codec2_ref }}
          path: codec2

      - name: Configure (MSVC x64)
        run: cmake -S codec2 -B codec2/build -A x64 -DBUILD_SHARED_LIBS=ON -DUNITTEST=OFF

      - name: Build library
        run: cmake --build codec2/build --config Release --target codec2

      - name: Install to staging
        run: cmake --install codec2/build --config Release --prefix staging

      - name: Package
        shell: bash
        run: |
          mkdir -p out/codec2_x64/include
          find staging -name "*.dll" -exec cp {} out/codec2_x64/ \;
          find staging -name "*.lib" -exec cp {} out/codec2_x64/ \;
          find codec2/build -name "codec2.dll" -exec cp {} out/codec2_x64/ \; 2>/dev/null || true
          find codec2/build -name "codec2.lib" -exec cp {} out/codec2_x64/ \; 2>/dev/null || true
          cp -r staging/include/* out/codec2_x64/include/ 2>/dev/null || true
          cp codec2/COPYING out/codec2_x64/
          echo "codec2 ${{ inputs.codec2_ref }} built $(date -u +%F) via MSVC x64" > out/codec2_x64/VERSION.txt
          ls -laR out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codec2-win-x64
          path: out/
          if-no-files-found: error
